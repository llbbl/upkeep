name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    # Skip version bump commits to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      tag: ${{ steps.version.outputs.next }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Just
        uses: extractions/setup-just@v4

      # The Verify step below runs `just test`, which includes the CLI
      # integration tests. Those shell out to the package manager the fixture
      # declares (pnpm), and ubuntu-latest does not ship pnpm. Without this the
      # release is blocked: Verify fails, so no version bump is ever pushed.
      # Mirrors the same step in ci.yml -- both workflows run the suite, so both
      # need the package manager.
      - name: Setup pnpm (required by the CLI integration tests)
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Determine next version
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest=$latest_tag" >> "$GITHUB_OUTPUT"

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          commits=$(git log "$latest_tag"..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          if echo "$commits" | grep -qE "^feat(\(.+\))?!:|^fix(\(.+\))?!:|^refactor(\(.+\))?!:|BREAKING CHANGE"; then
            major=$((major + 1))
            minor=0
            patch=0
          elif echo "$commits" | grep -qE "^feat(\(.+\))?:"; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          next="v${major}.${minor}.${patch}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from $latest_tag)"

      - name: Update versions
        run: |
          bun install --frozen-lockfile
          just set-version ${{ steps.version.outputs.version }}

      - name: Verify
        run: |
          just typecheck
          just test
          # Compile for the host target too. A break here fails the run before
          # the bump commit is pushed, rather than after a tag already exists.
          just build

      # The tag is deliberately NOT created here. It is pushed by the release
      # job once every platform binary has built, so a compile failure can no
      # longer strand a tag on the repo with no release attached to it.
      - name: Commit and push version bump
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/cli/index.ts skills/*/SKILL.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
          # If an earlier run pushed this bump but failed before tagging, the
          # version files are already correct and there is nothing to commit.
          # Reuse that commit and carry on to the build rather than dying on an
          # empty `git commit`, which would wedge releases permanently.
          if git diff --cached --quiet; then
            echo "Version files already at v$VERSION; reusing the existing commit."
          else
            git commit -m "chore(release): bump version to v$VERSION"
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            artifact: upkeep-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            artifact: upkeep-linux-arm64
          - target: darwin-arm64
            os: macos-latest
            artifact: upkeep-darwin-arm64
          - target: darwin-x64
            os: macos-latest
            artifact: upkeep-darwin-x64
          - target: windows-x64
            os: windows-latest
            artifact: upkeep-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build:${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release

          # Tar+gzip each Unix binary as `upkeep` inside the archive, named
          # upkeep_<version>_<os>_<arch>.tar.gz with Homebrew-style arch tokens.
          archive() {
            src="$1"; os="$2"; arch="$3"
            cp "$src" upkeep
            chmod +x upkeep
            tar -czf "release/upkeep_${VERSION}_${os}_${arch}.tar.gz" upkeep
            rm upkeep
          }
          archive artifacts/upkeep-linux-x64/upkeep-linux-x64       linux  amd64
          archive artifacts/upkeep-linux-arm64/upkeep-linux-arm64   linux  arm64
          archive artifacts/upkeep-darwin-x64/upkeep-darwin-x64     darwin amd64
          archive artifacts/upkeep-darwin-arm64/upkeep-darwin-arm64 darwin arm64

          # Windows ships as a raw .exe — Homebrew does not consume it.
          cp artifacts/upkeep-windows-x64.exe/upkeep-windows-x64.exe \
            "release/upkeep_${VERSION}_windows_amd64.exe"

          # checksums.txt lists the sha256 of each tarball; the Homebrew tap
          # downloads this to render per-platform url + sha256.
          ( cd release && sha256sum upkeep_"${VERSION}"_*.tar.gz > checksums.txt )

          ls -la release/
          cat release/checksums.txt

      # Everything above this point can fail without leaving a trace on the
      # repo. The tag is the first irreversible act, so it goes last -- after
      # all five binaries exist and have been packaged.
      - name: Create and push tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent so a re-run after a partial failure can complete rather
          # than dying because the tag it is trying to create already exists.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally."
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG" || echo "Tag $TAG is already on origin."

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            release/*.tar.gz
            release/*.exe
            release/checksums.txt
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
