name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # The CLI integration tests shell out to whichever package manager the
      # fixture declares, and tests/fixtures/sample-project ships a
      # pnpm-lock.yaml. ubuntu-latest provides npm and yarn but not pnpm, so
      # without this the audit/deps integration tests get an empty stdout and
      # fail on JSON.parse.
      - name: Setup pnpm (required by the CLI integration tests)
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test and coverage gate
        run: ./scripts/check-coverage.sh

      # Compiling here is what stops a build break from reaching main. Lint,
      # typecheck and tests all pass on code that `bun build --compile` cannot
      # bundle, so without this step the first failure signal arrives during
      # the release run, after a version bump has already been pushed.
      - name: Build binary
        run: bun run build
