name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      # Compiling here is what stops a build break from reaching main. Lint,
      # typecheck and tests all pass on code that `bun build --compile` cannot
      # bundle, so without this step the first failure signal arrives during
      # the release run, after a version bump has already been pushed.
      - name: Build binary
        run: bun run build
