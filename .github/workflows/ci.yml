name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. Scoping this to `branches: [main]`
  # meant a PR stacked on another PR received no test run at all -- and a
  # `mergeStateStatus` of CLEAN then reads as "nothing is blocking" rather than
  # "tests passed". A stacked PR sat green-looking with 12 failing tests until
  # it was retargeted onto main.
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Bun
        uses: pnpm/setup@v3
        with:
          runtime: bun@1.4.0
          require-lockfile: true
          cache: true

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test and coverage gate
        run: ./scripts/check-coverage.sh

      # Compiling here is what stops a build break from reaching main. Lint,
      # typecheck and tests all pass on code that `bun build --compile` cannot
      # bundle, so without this step the first failure signal arrives during
      # the release run, after a version bump has already been pushed.
      - name: Build binary
        run: bun run build
